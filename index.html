<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Oswald:wght@700&display=swap">
</head>
<body>

<h2 class="sr-only">Workout tracker v2 — Session A and B with improved layout, set tracking, rest timer, and JSON progress saving</h2>

<link rel="stylesheet" href="style.css">

<div id="wrap">
  <nav class="top-nav">
    <button class="top-tab top-tab-active" id="nav-workout" onclick="setTab('workout')">
      <i class="ti ti-barbell" aria-hidden="true"></i>
      <span>Workout</span>
    </button>
    <button class="top-tab" id="nav-history" onclick="setTab('history')">
      <i class="ti ti-history" aria-hidden="true"></i>
      <span>History</span>
    </button>
  </nav>

  <div class="sticky-hdr">
    <div class="hdr-top">
      <div class="hdr-brand">
        <span id="date-disp" class="hdr-date"></span>
      </div>
      <div class="hdr-right">
        <button class="run-hdr-btn" id="mute-btn" onclick="toggleMuteBtn()" aria-label="Toggle sound">&#x1F50A;</button>
        <button class="run-hdr-btn" onclick="openSettingsSheet()" aria-label="Settings">&#9881;</button>
        <button class="run-hdr-btn" onclick="openRunSheet()" aria-label="Log a run">
          &#x1F3C3;
        </button>
      </div>
    </div>
  </div>

  <div id="mini-bar" aria-hidden="true">
    <div class="mini-bar-row">
      <span id="mini-timer">--:--</span>
      <div class="mini-prog-wrap">
        <div class="mini-prog-bar"><div id="mini-prog-fill"></div></div>
      </div>
      <span id="mini-right">0 / 0</span>
    </div>
  </div>

  <div id="tab-workout">
    <div class="workout-panel-hdr">

      <div class="sess-row">
        <button class="sess-tab on-a" id="tab-A" onclick="switchSession('A')">
          <span class="sess-key">A</span>
          <span class="sess-info">
            <span class="sess-info-title">Push + core</span>
            <span class="sess-info-day">Monday</span>
          </span>
        </button>
        <button class="sess-tab" id="tab-B" onclick="switchSession('B')">
          <span class="sess-key">B</span>
          <span class="sess-info">
            <span class="sess-info-title">Pull + core</span>
            <span class="sess-info-day">Saturday</span>
          </span>
        </button>
      </div>

      <div class="hero">
        <div class="hero-block">
          <div id="timer-disp">--:--</div>
          <div class="hero-label">Elapsed</div>
          <button id="timer-btn" onclick="toggleTimer()">
            <i class="ti ti-player-play" aria-hidden="true"></i>
            <span>Start</span>
          </button>
        </div>
        <div class="hero-stats">
          <div class="hero-stat">
            <span id="prog-pct">0%</span>
            <span class="hero-stat-lbl">complete</span>
          </div>
          <div class="hero-stat">
            <span id="prog-sets">0 / 0</span>
            <span class="hero-stat-lbl">sets</span>
          </div>
        </div>
      </div>

      <div class="prog-bar-row">
        <div class="prog-bar"><div id="prog-fill"></div></div>
      </div>

      <div id="rest-row" style="display:none;">
        <span class="rest-label">Rest</span>
        <span id="rest-cnt"></span>
        <div class="rest-bar"><div id="rest-fill"></div></div>
        <button onclick="stopRest()" class="rest-skip">Skip</button>
      </div>

    </div>

    <div id="workout-view">
      <div id="ex-list"></div>
      <div class="actions">
        <button onclick="saveSession()" class="btn-primary">
          <i class="ti ti-device-floppy" aria-hidden="true"></i>
          <span>Save session</span>
        </button>
      </div>
    </div>
  </div>

  <div id="tab-history" style="display:none;">

    <div id="hist-view">
      <div id="cal-wrap"></div>
      <div class="hist-hdr">
        <div class="hist-title">Session history</div>
      </div>
      <div id="hist-list"></div>
    </div>

  </div>

  <div id="completion-overlay"></div>


</div>

<div class="sheet-backdrop" id="edit-backdrop" onclick="closeEdit()"></div>
<div class="edit-popover" id="edit-popover" role="dialog" aria-modal="true" aria-label="Edit set"></div>

<div class="sheet-backdrop" id="run-backdrop" onclick="closeRunSheet()"></div>
<div class="run-sheet" id="run-sheet" role="dialog" aria-modal="true" aria-label="Log a run">
  <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
  <div class="sheet-title">Log a Run</div>
  <div id="run-view">
    <div class="run-form">

      <div class="run-field">
        <label class="run-field-lbl" for="run-date">Date</label>
        <input id="run-date" class="run-select" type="date">
      </div>

      <div class="run-field">
        <label class="run-field-lbl" for="run-type">Run type</label>
        <select id="run-type" class="run-select">
          <option>Easy</option>
          <option>Long run</option>
          <option>Tempo</option>
          <option>Intervals</option>
          <option>Race</option>
        </select>
      </div>

      <div class="run-field">
        <label class="run-field-lbl" for="run-dist">Distance</label>
        <div class="run-dist-row">
          <input id="run-dist" class="run-input-num" type="number" step="0.1" min="0" placeholder="0.0" oninput="updatePace()">
          <span class="run-unit">km</span>
        </div>
      </div>

      <div class="run-field">
        <label class="run-field-lbl">Time</label>
        <div class="run-time-row">
          <input id="run-hh" class="run-input-num" type="number" min="0" max="23" placeholder="HH" oninput="updatePace()">
          <span class="run-time-sep">:</span>
          <input id="run-mm" class="run-input-num" type="number" min="0" max="59" placeholder="MM" oninput="updatePace()">
          <span class="run-time-sep">:</span>
          <input id="run-ss" class="run-input-num" type="number" min="0" max="59" placeholder="SS" oninput="updatePace()">
        </div>
        <div id="run-pace" class="run-pace">—</div>
      </div>

      <div class="run-field">
        <label class="run-field-lbl" for="run-notes">Notes</label>
        <textarea id="run-notes" class="ex-textarea" rows="2" placeholder="How it felt, conditions, route..."></textarea>
      </div>

      <div class="run-field">
        <button onclick="saveRun()" class="btn-primary">
          <i class="ti ti-device-floppy" aria-hidden="true"></i>
          <span>Save run</span>
        </button>
        <div id="run-error" class="run-error">Enter distance and time before saving.</div>
        <div id="run-confirm" class="run-confirm">Run saved.</div>
      </div>

    </div>
  </div>
</div>

<div class="sheet-backdrop" id="settings-backdrop" onclick="closeSettingsSheet()"></div>
<div class="run-sheet" id="settings-sheet" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="sheet-handle-wrap"><div class="sheet-handle"></div></div>
  <div class="sheet-title">Settings</div>

  <div class="sheet-section-lbl" style="margin-top:0;">App info</div>
  <div class="sheet-info-row">
    <span class="sheet-info-row-lbl">App version</span>
    <span class="sheet-info-row-val" id="sw-version-label">—</span>
  </div>

  <div class="sheet-section-lbl">Units</div>
  <div class="unit-toggle-row" role="group" aria-label="Weight unit">
    <button class="unit-toggle-btn" id="unit-btn-kg" onclick="setDisplayUnit('kg')">kg</button>
    <button class="unit-toggle-btn" id="unit-btn-lb" onclick="setDisplayUnit('lb')">lb</button>
  </div>

  <div class="sheet-section-lbl">Data</div>
  <button class="sheet-action-btn" onclick="exportJSON()">Download backup (JSON)</button>
  <button class="sheet-action-btn" onclick="document.getElementById('file-in').click()">Restore from backup</button>

  <div class="sheet-section-lbl">App</div>
  <button class="sheet-action-btn danger" onclick="forceUpdate()">Force update (clear cache)</button>

  <button class="sheet-close-btn" onclick="closeSettingsSheet()">Close</button>
</div>

<script type="module" src="js/app.js"></script>

<style>
#sw-update-banner{
  position:fixed;
  left:12px;
  right:12px;
  bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  z-index:9000;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  background:var(--color-background-secondary, #1f1f24);
  border:1px solid var(--color-border-secondary, #2c2c32);
  border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,0.35);
  font-family:var(--mono, 'JetBrains Mono', ui-monospace, monospace);
  color:var(--color-text-primary, #f1f1f3);
  max-width:480px;
  margin:0 auto;
  animation:sw-update-banner-in 220ms ease-out;
}
@keyframes sw-update-banner-in{
  from{transform:translateY(20px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}
#sw-update-banner .sw-update-msg{
  flex:1;
  font-size:14px;
  font-weight:500;
  letter-spacing:0.01em;
}
#sw-update-banner .sw-update-apply{
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  padding:8px 14px;
  border-radius:8px;
  border:1px solid var(--accent, #5a8cd6);
  background:var(--accent, #5a8cd6);
  color:#0c1424;
  cursor:pointer;
}
#sw-update-banner .sw-update-apply:hover{
  background:var(--accent-a-deep, #3b6db8);
  border-color:var(--accent-a-deep, #3b6db8);
}
#sw-update-banner .sw-update-dismiss{
  font-family:inherit;
  font-size:18px;
  line-height:1;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  border:1px solid transparent;
  background:transparent;
  color:var(--color-text-secondary, #a3a3a9);
  cursor:pointer;
}
#sw-update-banner .sw-update-dismiss:hover{
  color:var(--color-text-primary, #f1f1f3);
  background:var(--color-background-primary, #16161a);
  border-color:var(--color-border-secondary, #2c2c32);
}
</style>

<script>
if ('serviceWorker' in navigator) {
  let refreshing = false;
  const reloadOnce = () => {
    if (refreshing) return;
    refreshing = true;
    location.reload();
  };

  const showUpdateBanner = (reg) => {
    if (document.getElementById('sw-update-banner')) return;

    const banner = document.createElement('div');
    banner.id = 'sw-update-banner';
    banner.setAttribute('role', 'status');
    banner.setAttribute('aria-live', 'polite');

    const msg = document.createElement('span');
    msg.className = 'sw-update-msg';
    msg.textContent = 'An update is available';

    const applyBtn = document.createElement('button');
    applyBtn.type = 'button';
    applyBtn.className = 'sw-update-apply';
    applyBtn.textContent = 'Update now';

    const dismissBtn = document.createElement('button');
    dismissBtn.type = 'button';
    dismissBtn.className = 'sw-update-dismiss';
    dismissBtn.setAttribute('aria-label', 'Dismiss update notice');
    dismissBtn.innerHTML = '&times;';

    applyBtn.addEventListener('click', () => {
      applyBtn.disabled = true;
      navigator.serviceWorker.addEventListener('controllerchange', reloadOnce);
      const waiting = reg.waiting;
      if (waiting) {
        waiting.postMessage({ type: 'SKIP_WAITING' });
      } else {
        reloadOnce();
      }
    });

    dismissBtn.addEventListener('click', () => {
      banner.remove();
    });

    banner.appendChild(msg);
    banner.appendChild(applyBtn);
    banner.appendChild(dismissBtn);
    document.body.appendChild(banner);
  };

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      if (reg.waiting) {
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        reloadOnce();
        return;
      }

      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            showUpdateBanner(reg);
          }
        });
      });
    }).catch((err) => {
      console.warn('[sw] registration failed:', err);
    });
  });
}
</script>

<input type="file" id="file-in" accept=".json" style="display:none;" onchange="loadHistory(event)"/>
</body>
</html>
